<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Royal Match - Mobile Ad Carousel (Video-ready)</title>
  <style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    color: #fff;
    background: #0b2a66 url('assets/bg_Blue.png') center/260px repeat;
  }
  .ad { width: 100vw; height: 100dvh; max-width: 520px; margin: 0 auto;
        display: grid; grid-template-rows: auto 1fr auto; gap: 12px; padding: 16px 16px 20px; }
  .ad__header { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 12px; }
  .ad__logo { width: 300px; height: 300px; object-fit: contain; filter: drop-shadow(0 2px 8px rgba(0,0,0,.35)); }
  .ad__headline { font-size: clamp(16px, 2.8vw + 10px, 22px); margin: 0; font-weight: 900;
                  text-shadow: 0 2px 8px rgba(0,0,0,0.35); }
  .ad__hero { position: relative; border-radius: 20px; overflow: hidden;
              box-shadow: 0 20px 40px rgba(0,0,0,0.35), inset 0 0 0 1px rgba(255,255,255,0.06);
              background: rgba(0,0,0,.15); isolation: isolate; }
  .ad__hero::before { content: ""; display: block; padding-bottom: 62%; }
  .ad__frame { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; z-index: 2; }
  .carousel { position: absolute; inset: 0; display: grid; grid-template-rows: 1fr auto; }
  .carousel__track { display: grid; grid-auto-flow: column; grid-auto-columns: 100%; height: 100%;
                     transform: translateX(0); transition: transform 500ms cubic-bezier(.2,.9,.2,1); will-change: transform; }
  .slide { position: relative; }
  .slide img, .slide video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .slide__caption { position: absolute; left: 12px; bottom: 12px; font-weight: 900;
                    font-size: clamp(12px, 2.2vw + 6px, 16px); padding: 6px 10px; border-radius: 999px;
                    background: rgba(0,0,0,0.45); backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.18);
                    z-index: 3; }
  .dots { display: flex; justify-content: center; gap: 10px; padding: 10px 0 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; border: 0; background: rgba(255,255,255,0.5);
         box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
  .dot.is-active { background: #ffd400; }
  .ad__footer { display: grid; gap: 8px; justify-items: center; }
  .cta img { display: block; width: 220px; height: auto; filter: drop-shadow(0 10px 24px rgba(0,0,0,.35)); }
  .fine { margin: 0; opacity: .9; font-size: 12px; }
  @media (orientation: landscape) {
    .ad { max-width: 980px; grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr;
          grid-template-areas: "header header" "hero footer"; align-items: center; }
    .ad__header { grid-area: header; } .ad__hero { grid-area: hero; min-height: 60dvh; }
    .ad__hero::before { padding-bottom: 0; }
    .ad__footer { grid-area: footer; justify-items: start; padding-left: 12px; }
  }
  @media (prefers-reduced-motion: reduce) { .carousel__track { transition: none; } }
  </style>
</head>
<body>
  <main class="ad" role="region" aria-label="Royal Match mobile ad">
    <header class="ad__header">
      <img class="ad__logo" src="assets/RM_Logo.png" alt="Royal Match" />
      <h1 class="ad__headline">Rescue the King. Match & Win!</h1>
    </header>

    <section class="ad__hero">
      <img class="ad__frame" src="assets/Framev2_WithoutMask.png" alt="" aria-hidden="true"/>
      <div class="carousel" aria-roledescription="carousel" aria-label="Game previews">
        <div class="carousel__track" id="track">

          <!-- Image slides -->
          <article class="slide" aria-label="Labyrinth Escape">
            <img src="assets/RM_1279x02_Labyrinth_Escape_60s_1080x1920_EN01.png" alt="Labyrinth with dragon chasing the king" />
            <div class="slide__caption">Save the King</div>
          </article>
          <article class="slide" aria-label="Rock Stop by Lava">
            <img src="assets/RM_1438x01_RockStop_60sn_1080x1920_EN01.png" alt="Stop the rocks and avoid the lava" />
            <div class="slide__caption">Rescue the King</div>
          </article>
          <article class="slide" aria-label="Splash Toxic">
            <img src="assets/RM_1441x02_SplashToxic_59sn_1080x1920_EN01.png" alt="Toxic liquid puzzle board" />
            <div class="slide__caption">Match • Blast • Win</div>
          </article>

          <!-- Video slides -->
          
          <article class="slide" aria-label="Video demo" data-type="video">
            <video class="media" src="assets/video1.mp4" muted playsinline webkit-playsinline loop preload="metadata" poster="assets/RM_1279x02_Labyrinth_Escape_60s_1080x1920_EN01.png"></video>
            <div class="slide__caption">Gameplay Video</div>
          </article>

        </div>
        <div class="dots" role="tablist" aria-label="Slides">
          <button class="dot is-active" role="tab" aria-selected="true"></button>
          <button class="dot" role="tab" aria-selected="false"></button>
          <button class="dot" role="tab" aria-selected="false"></button>
          <button class='dot' role='tab' aria-selected='false'></button>
        </div>
      </div>
    </section>

    <footer class="ad__footer">
      <a class="cta" href="#" role="button" aria-label="Play now">
        <img src="assets/BUTTON.png" alt="Play Now!" />
      </a>
      <p class="fine">Free to play • In-app purchases • 4.7★</p>
    </footer>
  </main>

  <script>
  (() => {
    const track = document.getElementById('track');
    const dots = Array.from(document.querySelectorAll('.dot'));
    const slides = Array.from(track.children);
    let index = 0; const total = slides.length; let timer = null; const INTERVAL = 3000;

    function updateMedia(activeIndex) {
      slides.forEach((s, n) => {
        const vid = s.querySelector('video');
        if (!vid) return;
        if (n === activeIndex) { try { vid.play(); } catch(e) { } }
        else { try { vid.pause(); vid.currentTime = 0; } catch(e) { } }
      });
    }

    function go(i){
      index = (i + total) % total;
      track.style.transform = `translateX(-${index*100}%)`;
      dots.forEach((d,n)=>d.classList.toggle('is-active', n===index));
      updateMedia(index);
    }

    function start(){ stop(); timer=setInterval(()=>go(index+1),INTERVAL); }
    function stop(){ if(timer) clearInterval(timer); timer=null; }

    dots.forEach((dot,i)=>dot.addEventListener('click',()=>{ go(i); start(); }));

    let startX=0,currentX=0,dragging=false;
    track.addEventListener('touchstart',e=>{ if(!e.touches[0])return; startX=e.touches[0].clientX; dragging=true; stop(); },{passive:true});
    track.addEventListener('touchmove',e=>{ if(!dragging||!e.touches[0])return; currentX=e.touches[0].clientX;
      const dx=currentX-startX; track.style.transition='none'; track.style.transform=`translateX(calc(-${index*100}% + ${dx}px))`; },{passive:true});
    function endSwipe(dx){ track.style.transition=''; const threshold=50;
      if(dx>threshold) go(index-1); else if(dx<-threshold) go(index+1); else go(index); start(); }
    track.addEventListener('touchend',e=>{ dragging=false; const dx=(currentX||startX)-startX; endSwipe(dx); startX=currentX=0; });

    document.addEventListener('visibilitychange',()=>{ if(document.hidden) stop(); else { start(); updateMedia(index); } });

    go(0); start();
  })();
  </script>
</body>
</html>
